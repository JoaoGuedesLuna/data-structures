name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Validate release version
        shell: bash
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          RELEASE_VERSION="${RELEASE_TAG#v}"

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            echo "Expected format: v1.0.0"
            exit 1
          fi

          PROJECT_VERSION=$(./mvnw --batch-mode --quiet -DforceStdout help:evaluate -Dexpression=project.version)

          if [[ "$RELEASE_VERSION" != "$PROJECT_VERSION" ]]; then
            echo "::error::Tag version ($RELEASE_VERSION) does not match pom.xml version ($PROJECT_VERSION)"
            exit 1
          fi

          echo "Release version validated: $RELEASE_VERSION"

      - name: Build and run tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Validate package artifacts
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          MAIN_JAR="target/data-structures-${VERSION}.jar"
          SOURCES_JAR="target/data-structures-${VERSION}-sources.jar"
          JAVADOC_JAR="target/data-structures-${VERSION}-javadoc.jar"

          for FILE in "$MAIN_JAR" "$SOURCES_JAR" "$JAVADOC_JAR"; do
            if [[ ! -f "$FILE" ]]; then
              echo "::error::Artifact not found: $FILE"
              exit 1
            fi

            echo "Validated artifact: $FILE"
          done

      - name: Publish to GitHub Packages
        run: ./mvnw --batch-mode --no-transfer-progress deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          MAIN_JAR_FILE="target/data-structures-${VERSION#v}.jar"
          SOURCES_JAR_FILE="target/data-structures-${VERSION#v}-sources.jar"
          JAVADOC_JAR_FILE="target/data-structures-${VERSION#v}-javadoc.jar"

          gh release create "$VERSION" "$MAIN_JAR_FILE" "$SOURCES_JAR_FILE" "$JAVADOC_JAR_FILE" --verify-tag --title "$VERSION" --generate-notes
